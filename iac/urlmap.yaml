    name: yummyos-url-map
    defaultService: global/backendServices/yummyos-backend-service
    hostRules:
    - hosts:
      - qms.yummycorp.com
      pathMatcher: qms-web-app-matcher
    - hosts:
      - order-integration.yummycorp.com
      pathMatcher: yfc-order-integration-matcher
    - hosts:
      - inventory-new.yummycorp.com
      pathMatcher: erp-inventory-matcher
    - hosts:
      - stocktake-new.yummycorp.com
      pathMatcher: erp-stocktake-matcher
    - hosts:
      - stockwaste.yummycorp.com
      pathMatcher: erp-stockwaste-matcher
    - hosts:
      - shop.yummykitchen.com
      pathMatcher: yfc-customer-matcher
    - hosts:
      - admin.yummykitchen.com
      pathMatcher: yfc-admin-matcher
    - hosts:
      - yummyos.yummycorp.com
      pathMatcher: yummyos-matcher
    pathMatchers:
    - name: qms-web-app-matcher
      defaultService: global/backendServices/qms-web-app-backend-service
      routeRules:
      - matchRules:
        - prefixMatch: /
        priority: 1000  # 0 is highest
        routeAction:
          weightedBackendServices:
          - backendService: global/backendServices/qms-web-app-backend-service
            weight: 100
    - name: yfc-order-integration-matcher
      defaultService: global/backendServices/yfc-order-integration-backend-service
